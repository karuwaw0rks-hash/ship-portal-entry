<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="theme-color" content="#23453d">
  <title>SHIP PORTAL</title>
  <link rel="apple-touch-icon" sizes="180x180" href="./apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="180x180" href="./apple-touch-icon.png">
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; padding: 24px; min-height: 100vh; min-height: 100svh; display: grid; place-items: center; background: #f0f7f3; color: #23453d; font: 16px/1.6 system-ui, sans-serif; }
    main { width: min(100%, 360px); text-align: center; padding: 32px 24px; border: 1px solid #cfddd6; border-radius: 22px; background: #fff; }
    img { border-radius: 20px; }
    h1 { margin: 12px 0 0; font-size: 26px; }
    p { margin: 0 0 24px; color: #4e6b60; }
    a { display: block; padding: 12px; border-radius: 12px; background: #23453d; color: #fff; font-weight: 700; text-decoration: none; }
    #prepare-shortcut { margin-top: 14px; padding: 8px; border: 0; background: none; color: #23453d; font: inherit; text-decoration: underline; cursor: pointer; }
    #shortcut-status { margin: 8px 0 0; font-size: 14px; }
    a:focus-visible { outline: 3px solid #277d64; outline-offset: 4px; }
  </style>
</head>
<body>
  <main>
    <img src="./apple-touch-icon.png" width="80" height="80" alt="">
    <h1>SHIP PORTAL</h1>
    <p>友セカンド</p>
    <a id="portal-link" href="https://script.google.com/macros/s/AKfycby-MujcGiE9Y2-p5FrduMT8InxJHfu9TAFivwbgvpzTeUeTYJbRlrdl21ynh6Xet0M/exec">ポータルを開く</a>
    <button id="prepare-shortcut" type="button">自動で開くアイコンを追加する準備</button>
    <p id="shortcut-status" role="status" hidden></p>
  </main>
  <script>
    const url = new URL(window.location.href);
    if (url.searchParams.get('launch') === '1') {
      window.location.replace(document.getElementById('portal-link').href);
    } else {
      const prepare = document.getElementById('prepare-shortcut');
      const status = document.getElementById('shortcut-status');
      prepare.addEventListener('click', () => {
        url.searchParams.set('launch', '1');
        try {
          window.history.replaceState(null, '', url.href);
          prepare.hidden = true;
          status.textContent = 'この画面のまま、共有 → ホーム画面に追加を押してください。';
        } catch (_) {
          status.textContent = '追加の準備ができませんでした。Safariで入口を開いてお試しください。';
        }
        status.hidden = false;
      });
    }
  </script>
</body>
</html>
